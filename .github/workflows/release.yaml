# Updated release.yaml
name: Release and Deploy

on:
  push:
    branches: ['main']
  # Push was the only trigger, so a run that died on a transient credential failure could
  # only be retried by a repo admin or by landing a throwaway commit.
  workflow_dispatch:

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          
      - run: npm ci

      - name: Build Engine
        run: npm run build:engine

      - name: Run Tests
        run: npm test

      # Run semantic-release first to update version
      - name: Semantic Release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      # Only proceed with deployment if a new release was created
      - name: Build
        if: steps.semantic.outputs.new-release-published == 'true'
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.semantic.outputs.new-release-version }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SKETCHFAB_TOKEN: ${{ secrets.VITE_SKETCHFAB_TOKEN }}

      - name: Setup Pages
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './app/dist'

      - name: Deploy to GitHub Pages
        if: steps.semantic.outputs.new-release-published == 'true'
        id: deployment
        uses: actions/deploy-pages@v5