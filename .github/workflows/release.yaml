# Updated release.yaml
name: Release and Deploy

on:
  push:
    branches: ['main']
  # Push was the only trigger, so a run that died on a transient credential failure could
  # only be retried by a repo admin or by landing a throwaway commit.
  workflow_dispatch:

jobs:
  release:
    # PAUSED — manual dispatch only. semantic-release commits the version bump and pushes the
    # tag during `prepare`, i.e. BEFORE `publish`, so a failing npm publish still burns a
    # version: v7.25.0 and v7.25.1 were both tagged with nothing published behind them. Until
    # the trusted publisher is configured on npmjs.com, keep pushes from ratcheting further.
    # To restore: drop the `github.event_name` clause.
    if: >-
      github.event_name == 'workflow_dispatch'
      && !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          
      - run: npm ci

      # @semantic-release/npm only pre-flights the OIDC exchange; the publish itself shells out
      # to `npm publish`, which needs npm's own trusted-publishing support (>= 11.5.1). Node 22
      # ships npm 10.x, so without this the exchange verifies and the publish still fails.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build Engine
        run: npm run build:engine

      - name: Run Tests
        run: npm test

      # Run semantic-release first to update version.
      # No NPM_TOKEN: auth is OIDC trusted publishing, configured per-package on npmjs.com
      # against this repo + workflow file + the `github-pages` environment below. Passing a
      # token as well would let a broken credential silently take over and fail at publish
      # time — after the tag has already been pushed.
      - name: Semantic Release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Only proceed with deployment if a new release was created
      - name: Build
        if: steps.semantic.outputs.new-release-published == 'true'
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.semantic.outputs.new-release-version }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SKETCHFAB_TOKEN: ${{ secrets.VITE_SKETCHFAB_TOKEN }}

      - name: Setup Pages
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './app/dist'

      - name: Deploy to GitHub Pages
        if: steps.semantic.outputs.new-release-published == 'true'
        id: deployment
        uses: actions/deploy-pages@v5